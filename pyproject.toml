[project]
name = "pinn-vs-ssf-schrodinger"
version = "1.0.0"
description = "Honest PINN vs SSF benchmark for the 1D Schrödinger / GPE"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["results", ".git", ".venv", "*.md"]

[tool.ruff.lint]
# Only enforce the rules that actually catch bugs.
select = ["E", "F", "W", "I", "UP", "B"]
# Ignore the style rules that fight with physics notation and multi-line plotting.
ignore = [
    "E501",   # line too long (README-style tables in Python are fine)
    "E701",   # multiple statements on one line with colon (if cond: return)
    "E702",   # multiple statements on one line with semicolon (plt.xlabel(); plt.ylabel())
    "E731",   # do not assign a lambda expression
    "N802",   # function name V_fn (physics uppercase)
    "N803",   # argument name V, Nx, T, L (physics notation)
    "N806",   # variable name Nx, Nxs, V, Ru, Rv, Veff (physics notation)
    "UP034",  # extraneous parentheses
    "SIM105", # try/except/pass (fine for YAML fallback)
    "F841",   # unused local (dx in split_step, kept for readability)
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"